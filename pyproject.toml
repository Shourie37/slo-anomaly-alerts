[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sloalerts"
version = "0.1.0"
description = "Detectors and an alert manager that catch what static threshold alarms miss"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shourie Amireddy", email = "shourie3009@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sloalerts = "sloalerts.cli:main"

[tool.setuptools]
packages = ["sloalerts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
